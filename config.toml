baseURL = "https://zhengkai15.github.io/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Kai Zheng | AI4Science"
theme = "papermod"
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false
paginate = 10

# Sitemap
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# 主页菜单
[[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/post/"
    weight = 20
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40

[params]
  env = "production"
  title = "Kai Zheng"
  description = "Kai Zheng - Algorithm Engineer focusing on AI for Science, Weather Forecasting Foundation Models, and Multimodal Generation"
  keywords = ["Kai Zheng", "AI4Science", "Weather Forecasting", "Foundation Model", "Diffusion", "Multimodal"]
  author = "Kai Zheng"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # 站点 Logo/标题（导航栏左侧）
  [params.label]
    text = "Kai Zheng"
    icon = "https://avatars.githubusercontent.com/u/59335385?v=4"
    iconHeight = 35

  # 首页 Profile 模式（个人主页风格）
  [params.profileMode]
    enabled = true
    title = "Kai Zheng"
    subtitle = "Algorithm Engineer · AI for Science<br>Weather Forecasting Foundation Models · Diffusion · Multimodal<br>LLM Data Engineering · Generative Models · RL Post-training"
    imageUrl = "https://avatars.githubusercontent.com/u/59335385?v=4"
    imageWidth = 180
    imageHeight = 180
    imageTitle = "Kai Zheng"

    [[params.profileMode.buttons]]
      name = "Posts"
      url = "/post/"

    [[params.profileMode.buttons]]
      name = "About"
      url = "/about/"

    [[params.profileMode.buttons]]
      name = "GitHub"
      url = "https://github.com/zhengkai15"

  # 社交图标
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/zhengkai15"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:kaizheng.work@gmail.com"
  [[params.socialIcons]]
    name = "twitter"
    url = "https://github.com/zhengkai15"

  # 首页展示文章摘要
  [params.homeInfoParams]
    Title = "Hi there 👋"
    Content = "Welcome to my blog. I write about AI for Science, weather forecasting foundation models, diffusion models and my research journey."

# Markdown 渲染
[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = true

# 隐私
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
  [privacy.youtube]
    privacyEnhanced = true
